<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetching Dog Data</title>
</head>

<body></body>

<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@main/build/nn.min.js"></script>
<script>
  /* global nn */

  async function setup () {
    // fetch data from the "Dog CEO" REST API
    const url = 'https://dog.ceo/api/breed/terrier/yorkshire/images/random'
    const res = await fetch(url)
    const data = await res.json()
    // press F12 to open console (fn + F12 on mac)
    console.log(data)
    // create an <img> and add it to the page
    nn.create('img')
      .set('src', data.message)
      .css('width', 235)
      .addTo('body')
  }

  nn.on('load', setup)
  nn.on('click', setup)
</script>
</html>
